name: Build Luma para Windows (.exe / Setup)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el Release al subir un tag

concurrency:
  group: build-pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Si subes un tag (ej. v1.2.0), el instalador usa esa versión.
      - name: Versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Setup (.exe instalador) + Portable (.exe)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Listar resultado
        run: ls -lh release/*.exe

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Windows
          path: |
            desktop/release/Luma-Setup-*.exe
            desktop/release/Luma-Portable-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release (solo con tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/Luma-Setup-*.exe
            desktop/release/Luma-Portable-*.exe
          generate_release_notes: true
