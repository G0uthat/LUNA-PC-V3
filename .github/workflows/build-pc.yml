name: Build PC (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Setup (.exe instalador) + Portable (.exe)
        run: npm run dist:win

      - name: Listar resultado
        shell: pwsh
        run: Get-ChildItem -Recurse -Path release -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Subir artefactos (.exe instalador y portable)
        uses: actions/upload-artifact@v4
        with:
          name: luna-pc-windows-exe
          path: |
            desktop/release/*.exe
            desktop/release/*Setup*.exe
            desktop/release/*Portable*.exe
          if-no-files-found: fail

      - name: Publicar Release (solo con tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
